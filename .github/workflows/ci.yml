name: CI & Plugin Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}${{ matrix.multisite == '1' && ', multisite' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            coverage: none
            multisite: '0'
          - php: '8.4'
            coverage: none
            multisite: '1'
          - php: '8.4'
            coverage: pcov
            multisite: '0'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kilobyte_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_MULTISITE: ${{ matrix.multisite }}
      WP_VERSION: '7.1.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mysqli
          coverage: ${{ matrix.coverage }}
          tools: composer:v2, wp-cli

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Download WordPress
        run: |
          mkdir -p .cache/wordpress
          wp core download --version="$WP_VERSION" --path=.cache/wordpress --skip-content

      - name: Run tests
        if: matrix.coverage == 'none'
        run: composer test

      - name: Run tests with coverage
        if: matrix.coverage == 'pcov'
        run: composer test:coverage

      - name: Require 90% line coverage
        if: matrix.coverage == 'pcov'
        run: php tests/bin/check-coverage.php .cache/coverage/clover.xml 90

  lint-and-build:
    name: PHPCS, TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS (VIP Go + WP Extra)
        run: composer run lint -- --no-cache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build production assets
        run: npm run build

      - name: Stage release directory
        run: |
          mkdir -p dist/release
          rsync -a --exclude-from=.distignore ./ dist/release/

      - name: Run WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/release
          slug: kilobyte-image-optimizer
          categories: plugin_repo,security,performance

  docs-site:
    name: Standalone Website Build & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build WordPress plugin and static standalone site
        run: |
          npm run build
          npm run build:docs

      - name: Verify checked-in docs/ and build/ match fresh production build
        run: |
          git diff --exit-code docs/ build/
          test -z "$(git ls-files --others --exclude-standard docs/ build/)"

      - name: Install Playwright Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run unit, SEO, ZIP, and multi-browser E2E tests
        run: npm run test:docs
